# 2026-11-14 켬: 10분 자동 되돌리기 타이머를 건 뒤 start → SSH(LAN·Tailscale)·사이트·targets 18/18·NodePort(Tailscale)
# 확인 → 타이머 취소 → true(부팅 때도 켜짐). 처음 켤 때는 README "방화벽 적용 절차" 를 따른다.
firewall_enabled: true

# 집 LAN 쪽 인터페이스(지금은 Wi-Fi 만 연결, 유선은 꽂으면 같은 규칙)
firewall_lan_ifaces:
  - wlan0
  - eth0

# k3s 기본 Pod·Service 대역 — Pod 에서 호스트(kubelet 10250·node-exporter 9100·apiserver 6443)로 오는 트래픽
firewall_cluster_cidrs:
  - 10.42.0.0/16
  - 10.43.0.0/16
