# 자동 보안 업데이트 (감사 M8, 2026-11-11) — 보안 출처만, 자동 재부팅 없음(재부팅은 점검 창에 사람이).
# 50unattended-upgrades 는 패키지 기본 파일 그대로(md5 가 /usr/share/unattended-upgrades/ 원본과 같음) → 관리하지 않고,
# 52clog-security-only 가 #clear 로 출처를 security 하나로 덮어쓴다. 실제 값 확인: apt-config dump | grep Unattended
- name: Unattended-upgrades 설치
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: 주기 실행 켜기(목록 갱신·업그레이드 매일)
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: 보안 출처만·자동 재부팅 없음
  ansible.builtin.copy:
    src: 52clog-security-only
    dest: /etc/apt/apt.conf.d/52clog-security-only
    owner: root
    group: root
    mode: "0644"

- name: Apt 주기 timer 켜짐
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
