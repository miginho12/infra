# CI 는 형식·문법 검사만 한다. plan/apply 는 API key 가 필요해 로컬에서 승인 후 실행(ADR-095).
name: terraform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [uptime, cloudflare]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: fmt
        run: terraform fmt -check -recursive -diff
      # -backend=false: state 없이 provider 만 받는다. lock 파일과 다른 provider 가 오면 실패한다.
      - name: init
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: validate
        run: terraform validate

  # Ansible(Pi 호스트 설정, 2026-11-14): 문법·린트만. 실제 점검·적용은 Pi 에서 사용자가 sudo 로(ansible/run.sh).
  ansible:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    env:
      UV_PYTHON: "3.13"   # ansible-core 2.21 은 Python 3.12 이상, Pi 와 같은 3.13
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: syntax-check
        run: ./run.sh --syntax-check
      - name: ansible-lint
        run: ./run.sh lint
